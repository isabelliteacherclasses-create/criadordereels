<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Cinematic - Talk Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --azul-marinho: #112150;
            --dourado: #DCC591;
            --rose: #F4E7D8;
            --fonte-titulo: 'Cormorant Garamond', serif;
            --fonte-texto: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--rose);
            font-family: var(--fonte-texto);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }
        .painel {
            flex: 1;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(17, 33, 80, 0.08);
        }
        h1 {
            color: var(--azul-marinho);
            font-family: var(--fonte-titulo);
            margin-top: 0;
            font-size: 32px;
            border-bottom: 2px solid var(--rose);
            padding-bottom: 10px;
        }
        .sessao {
            background-color: #fcfcfc;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .sessao h3 {
            margin-top: 0;
            color: var(--azul-marinho);
            font-size: 16px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }
        input[type="text"], input[type="password"], input[type="number"], textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: var(--fonte-texto);
            font-size: 15px;
            margin-bottom: 10px;
        }
        textarea { height: 80px; resize: vertical; }
        .btn-secundario {
            background-color: #eee;
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--fonte-texto);
            font-weight: 600;
            width: 100%;
        }
        .btn-primario {
            background-color: var(--azul-marinho);
            color: var(--rose);
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--fonte-texto);
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-primario:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(17,33,80,0.2); }
        .btn-secundario:hover { background-color: #ddd; }
        
        .preview {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(17, 33, 80, 0.5);
            width: 360px;
            height: 640px;
            flex-shrink: 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Vídeo oculto usado apenas como motor gráfico */
        video { display: none; } 
    </style>
</head>
<body>
    <div class="container">
        <div class="painel">
            <h1>🎬 Talk Flow Studio</h1>
            
            <div class="sessao">
                <h3>1. Motor de Vídeo (Pixabay)</h3>
                <!-- A chave já fica preenchida e invisível para agilizar o uso diário -->
                <input type="password" id="apiKey" value="58105159-93476e94447c8ebc125d91fae" style="display: none;">
                
                <label>Tema do Fundo (em inglês):</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="buscaPixabay" placeholder="Ex: coffee, rain, study, city" value="coffee">
                    <button class="btn-secundario" style="width: auto;" onclick="buscarVideoPixabay()">Buscar Vídeo</button>
                </div>
                <small id="statusVideo" style="color: green; font-weight: bold; display: none;">✓ Vídeo espetacular carregado!</small>
            </div>

            <div class="sessao">
                <h3>2. Roteiro Cinematográfico</h3>
                <label>Frase de Impacto 1 (O Gancho - Surge aos 0s):</label>
                <textarea id="texto1" placeholder="Ex: Pare de traduzir tudo na sua cabeça."></textarea>

                <label>Frase de Impacto 2 (A Virada - Surge aos 3s):</label>
                <textarea id="texto2" placeholder="Ex: A fluência mora nos blocos sonoros."></textarea>
            </div>
            
            <div class="sessao">
                <h3>3. Renderização</h3>
                <label>Duração do Vídeo (segundos):</label>
                <input type="number" id="tempoVideo" value="10" min="5" max="30">
                
                <button class="btn-secundario" onclick="testarAnimacao()">Testar Visual e Animação ▶️</button>
                <button id="btnGravar" class="btn-primario" onclick="gravarCinematic()">Gravar Reel Definitivo 📥</button>
            </div>
        </div>
        
        <div class="preview">
            <canvas id="videoCanvas" width="1080" height="1920"></canvas>
            <video id="motorVideo" loop muted crossorigin="anonymous"></video>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const motorVideo = document.getElementById('motorVideo');
        
        window.onload = () => {
            desenharFrameEstatico(); 
        };

        // ==========================================
        // INTEGRAÇÃO PIXABAY (Busca Automática)
        // ==========================================
        async function buscarVideoPixabay() {
            const query = document.getElementById('buscaPixabay').value;
            const apiKey = document.getElementById('apiKey').value;
            const status = document.getElementById('statusVideo');

            status.style.display = 'block';
            status.style.color = 'orange';
            status.innerText = "A procurar vídeo cinematográfico...";

            try {
                const url = `https://pixabay.com/api/videos/?key=${apiKey}&q=${encodeURIComponent(query)}&per_page=15`;
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.hits && data.hits.length > 0) {
                    // Sorteia um dos 5 primeiros resultados para o fundo não ser sempre igual
                    const videoSorteado = data.hits[Math.floor(Math.random() * Math.min(5, data.hits.length))];
                    // Pega o URL do ficheiro de vídeo
                    const linkVideo = videoSorteado.videos.medium.url;
                    
                    motorVideo.src = linkVideo;
                    motorVideo.load();
                    
                    status.style.color = 'green';
                    status.innerText = "✓ Vídeo espetacular carregado!";
                    
                    motorVideo.onloadeddata = () => {
                        motorVideo.currentTime = 0;
                        setTimeout(() => desenharFrameAnimado(0), 200); 
                    };
                } else {
                    status.style.color = 'red';
                    status.innerText = "Nenhum vídeo encontrado. Tente outro termo em inglês.";
                }
            } catch(e) {
                status.style.color = 'red';
                status.innerText = "Erro na ligação com o Pixabay.";
            }
        }

        // ==========================================
        // MOTOR DE RENDERIZAÇÃO CINEMÁTICA
        // ==========================================
        let loopId;

        function preencherTextoLongo(texto, x, y, opacidade) {
            ctx.fillStyle = `rgba(244, 231, 216, ${opacidade})`; // Rosé #F4E7D8
            ctx.font = 'bold 85px "Cormorant Garamond"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const palavras = texto.split(' ');
            let linha = '';
            let linhas = [];
            
            for(let n = 0; n < palavras.length; n++) {
                let testeLinha = linha + palavras[n] + ' ';
                let metricas = ctx.measureText(testeLinha);
                if (metricas.width > 900 && n > 0) {
                    linhas.push(linha);
                    linha = palavras[n] + ' ';
                } else {
                    linha = testeLinha;
                }
            }
            linhas.push(linha);
            
            let yAjustado = y - ((linhas.length - 1) * 110) / 2;
            for(let j = 0; j < linhas.length; j++) {
                ctx.fillText(linhas[j], x, yAjustado + (j * 110));
            }
        }

        function desenharFrameAnimado(tempoDecorrido) {
            // 1. Desenha o fundo Cinematográfico
            if (motorVideo.readyState >= 2) { 
                const canvasRatio = canvas.width / canvas.height;
                const videoRatio = motorVideo.videoWidth / motorVideo.videoHeight;
                let sx, sy, sWidth, sHeight;

                if (videoRatio > canvasRatio) {
                    sHeight = motorVideo.videoHeight;
                    sWidth = sHeight * canvasRatio;
                    sx = (motorVideo.videoWidth - sWidth) / 2;
                    sy = 0;
                } else {
                    sWidth = motorVideo.videoWidth;
                    sHeight = sWidth / canvasRatio;
                    sx = 0;
                    sy = (motorVideo.videoHeight - sHeight) / 2;
                }
                ctx.drawImage(motorVideo, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                
                // Película Azul Marinho (65% de opacidade para elegância e leitura)
                ctx.fillStyle = 'rgba(17, 33, 80, 0.65)'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                desenharFrameEstatico();
            }

            // 2. Rodapé Fixo
            ctx.font = '600 45px "Plus Jakarta Sans"';
            ctx.fillStyle = '#DCC591'; // Dourado
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('LEIA A LEGENDA 👇', canvas.width / 2, 1750);

            // 3. Efeito Fade-in do Roteiro (Estilo _boladecristal)
            const txt1 = document.getElementById('texto1').value;
            const txt2 = document.getElementById('texto2').value;

            // Frase 1 surge de 0s a 1.5s
            let opacidade1 = Math.min(1, tempoDecorrido / 1.5);
            if(txt1) preencherTextoLongo(txt1, canvas.width / 2, 600, opacidade1);

            // Frase 2 surge de 3s a 4.5s
            if(tempoDecorrido >= 3) {
                let opacidade2 = Math.min(1, (tempoDecorrido - 3) / 1.5);
                if(txt2) preencherTextoLongo(txt2, canvas.width / 2, 1200, opacidade2);
            }
        }

        function desenharFrameEstatico() {
            ctx.fillStyle = '#112150';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function loopRenderizacao() {
            if(motorVideo.paused && !gravandoFlag) return; 
            desenharFrameAnimado(motorVideo.currentTime);
            loopId = requestAnimationFrame(loopRenderizacao);
        }

        function testarAnimacao() {
            if(!motorVideo.src) {
                alert("Busque um vídeo de fundo primeiro!");
                return;
            }
            cancelAnimationFrame(loopId);
            motorVideo.currentTime = 0;
            motorVideo.play();
            loopRenderizacao();
        }

        // ==========================================
        // GRAVAÇÃO E EXPORTAÇÃO
        // ==========================================
        let gravador;
        let gravandoFlag = false;

        function gravarCinematic() {
            if(!motorVideo.src) {
                alert("Busque um vídeo de fundo primeiro!");
                return;
            }

            const btn = document.getElementById('btnGravar');
            const tempoEmSegundos = parseInt(document.getElementById('tempoVideo').value) || 10;
            
            gravandoFlag = true;
            btn.innerText = `🔴 Gravando Cinematografia... (${tempoEmSegundos}s)`;
            btn.style.backgroundColor = "red";
            btn.style.color = "white";
            btn.disabled = true;

            motorVideo.currentTime = 0;
            motorVideo.play();
            cancelAnimationFrame(loopId);
            loopRenderizacao(); 

            const stream = canvas.captureStream(30); 
            gravador = new MediaRecorder(stream, { mimeType: 'video/mp4' });
            let pedacosVideo = [];

            gravador.ondataavailable = e => { if (e.data.size > 0) pedacosVideo.push(e.data); };

            gravador.onstop = () => {
                gravandoFlag = false;
                motorVideo.pause();
                
                const blob = new Blob(pedacosVideo, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `TalkFlow_Cinematic.mp4`;
                link.click();

                btn.innerText = "Gravar Reel Definitivo 📥";
                btn.style.backgroundColor = "var(--azul-marinho)";
                btn.style.color = "var(--rose)";
                btn.disabled = false;
            };

            gravador.start();

            setTimeout(() => { gravador.stop(); }, tempoEmSegundos * 1000);
        }
    </script>
</body>
</html>
